name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # -----------------------------------
    # 1. Backend (Python) Kontrolleri
    # -----------------------------------
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Backend Dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Backend Tests
      run: |
        cd backend
        # Şu an projede pytest gibi bir test aracı olmadığı için 
        # kodun sözdizimsel (syntax) olarak hatasız olduğunu kontrol ediyoruz.
        # İleride test yazarsanız burayı `pytest` olarak değiştirebilirsiniz.
        python -m py_compile main.py models.py schemas.py database.py

    # -----------------------------------
    # 2. Frontend (React/Vite) Kontrolleri
    # -----------------------------------
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install
        
    - name: Run Frontend Lint & Build
      run: |
        cd frontend
        npm run lint
        npm run build
